<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Horse Tracker 9000: concept sketch of the pan-tilt-zoom camera head</title>
  <style>
    @font-face { font-family: "Space Grotesk"; src: url("/assets/fonts/SpaceGrotesk-Variable.woff2") format("woff2"); font-weight: 300 700; }
    @font-face { font-family: "JetBrains Mono"; src: url("/assets/fonts/JetBrainsMono-Variable.woff2") format("woff2"); font-weight: 100 800; }
    .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
    .sans { font-family: "Space Grotesk", system-ui, sans-serif; }
    .label { font: 600 23px "JetBrains Mono", ui-monospace, monospace; fill: #e8eefc; letter-spacing: 0.06em; }
    .num { font: 700 19px "JetBrains Mono", ui-monospace, monospace; text-anchor: middle; dominant-baseline: central; }
    .motion { font: 700 21px "JetBrains Mono", ui-monospace, monospace; fill: #ffc24b; letter-spacing: 0.12em; }
    .lead { fill: none; stroke: #8b9bc0; stroke-width: 1.6; }
    .part { stroke-width: 3; stroke-linejoin: round; }
    .spec-k { font: 600 19px "JetBrains Mono", ui-monospace, monospace; fill: #2de2ff; letter-spacing: 0.1em; }
    .spec-v { font: 400 21px "JetBrains Mono", ui-monospace, monospace; fill: #c9d4ee; }
  </style>
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.4" fill="#1a2744"/></pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ffc24b"/></marker>
    <linearGradient id="fov" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2de2ff" stop-opacity=".35"/><stop offset="1" stop-color="#2de2ff" stop-opacity="0"/></linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="#070b16"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>

  <!-- title block -->
  <text x="60" y="92" class="sans" font-size="50" font-weight="700" fill="#e8eefc" letter-spacing="-1">Horse Tracker 9000</text>
  <text x="62" y="134" class="mono" font-size="21" font-weight="600" fill="#2de2ff" letter-spacing="3">PAN-TILT-ZOOM HEAD · CONCEPT SKETCH</text>
  <text x="1540" y="92" class="mono" font-size="20" fill="#8b9bc0" text-anchor="end" letter-spacing="2">PRJ-04 · REV 0</text>

  <!-- ===== side view ===== -->
  <!-- camera's field of view -->
  <path d="M836 420 L1050 322 L1050 518 Z" fill="url(#fov)"/>

  <!-- tripod -->
  <g stroke="#3a4a6b" stroke-width="11" stroke-linecap="round">
    <path d="M520 700 L540 926" stroke="#26334f"/>
    <path d="M520 700 L384 926"/>
    <path d="M520 700 L656 926"/>
  </g>
  <rect x="455" y="680" width="130" height="22" rx="5" fill="#22304d" stroke="#3a4a6b" stroke-width="2"/>

  <!-- battery on the centre column -->
  <rect x="468" y="742" width="104" height="58" rx="9" fill="#141d33" stroke="#ffc24b" class="part"/>
  <text x="520" y="779" class="mono" font-size="18" font-weight="700" fill="#ffc24b" text-anchor="middle">+  −</text>

  <!-- pan base with the pan servo inside -->
  <rect x="420" y="585" width="200" height="95" rx="14" fill="#141d33" stroke="#2de2ff" class="part"/>
  <rect x="452" y="606" width="96" height="54" rx="6" fill="none" stroke="#2de2ff" stroke-opacity=".45" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="520" cy="633" r="15" fill="none" stroke="#2de2ff" stroke-opacity=".6" stroke-width="2"/>
  <rect x="430" y="569" width="180" height="16" rx="8" fill="#22304d" stroke="#2de2ff" stroke-width="2"/>

  <!-- vision computer, bolted to the side of the base -->
  <path d="M620 632 H652" stroke="#3a4a6b" stroke-width="8"/><rect x="652" y="597" width="112" height="72" rx="9" fill="#141d33" stroke="#b6f35a" class="part"/>
  <g stroke="#b6f35a" stroke-opacity=".55" stroke-width="2"><path d="M672 611 V641 M688 611 V641 M704 611 V641 M720 611 V641 M736 611 V641"/></g>
  <circle cx="746" cy="654" r="4" fill="#b6f35a"/>
  <!-- cables -->
  <path d="M668 597 C 660 548, 618 518, 600 492" fill="none" stroke="#4b5d85" stroke-width="5" stroke-linecap="round"/>
  <path d="M572 770 C 650 770, 712 730, 720 669" fill="none" stroke="#4b5d85" stroke-width="5" stroke-linecap="round"/>

  <!-- camera body and zoom lens (behind the near yoke arm) -->
  <rect x="420" y="334" width="80" height="18" rx="4" fill="#1a2442" stroke="#8b6cff" stroke-width="2"/>
  <rect x="380" y="350" width="250" height="140" rx="14" fill="#11192e" stroke="#8b6cff" class="part"/>
  <rect x="630" y="365" width="92" height="110" rx="6" fill="#1a2442" stroke="#8b6cff" class="part"/>
  <g stroke="#8b6cff" stroke-opacity=".5" stroke-width="2"><path d="M648 372 V468 M660 372 V468 M672 372 V468 M684 372 V468 M696 372 V468 M708 372 V468"/></g>
  <rect x="722" y="378" width="80" height="84" rx="5" fill="#1a2442" stroke="#8b6cff" class="part"/>
  <rect x="802" y="362" width="30" height="116" rx="6" fill="#1a2442" stroke="#8b6cff" class="part"/>
  <ellipse cx="834" cy="420" rx="7" ry="50" fill="#2de2ff" fill-opacity=".55"/>

  <!-- near yoke arm and tilt servo -->
  <path d="M478 586 V 418 A 42 42 0 0 1 562 418 V 586" fill="#1a2540" stroke="#2de2ff" class="part"/>
  <rect x="488" y="386" width="64" height="70" rx="8" fill="#22304d" stroke="#2de2ff" stroke-width="2"/>
  <circle cx="520" cy="420" r="15" fill="#2de2ff" fill-opacity=".85"/>
  <path d="M520 420 L520 395" stroke="#070b16" stroke-width="5" stroke-linecap="round"/>

  <!-- motion arrows -->
  <path d="M640 512 H826" fill="none" stroke="#ffc24b" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="733" y="548" class="motion" text-anchor="middle">ZOOM</text>
  <text x="628" y="519" class="mono" font-size="17" fill="#ffc24b" text-anchor="end">W</text>
  <text x="840" y="519" class="mono" font-size="17" fill="#ffc24b">T</text>
  <path d="M904.5 309.7 A 400 400 0 0 1 904.5 530.3" fill="none" stroke="#ffc24b" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="926" y="428" class="motion">TILT</text>
  <path d="M411 652.7 A 120 30 0 0 0 629 652.7" fill="none" stroke="#ffc24b" stroke-width="3" stroke-dasharray="10 7" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="338" y="700" class="motion">PAN</text>

  <!-- numbered callouts -->
  <g>
    <path class="lead" d="M676 365 V 248"/>
    <circle cx="676" cy="226" r="21" fill="#070b16" stroke="#8b6cff" stroke-width="2.5"/>
    <text x="676" y="227" class="num" fill="#8b6cff">01</text>
    <text x="710" y="234" class="label">ZOOM CAMERA</text>

    <path class="lead" d="M492 400 L 352 318"/>
    <circle cx="332" cy="306" r="21" fill="#070b16" stroke="#2de2ff" stroke-width="2.5"/>
    <text x="332" y="307" class="num" fill="#2de2ff">02</text>
    <text x="298" y="314" class="label" text-anchor="end">TILT SERVO</text>

    <path class="lead" d="M454 614 L 352 556"/>
    <circle cx="332" cy="544" r="21" fill="#070b16" stroke="#2de2ff" stroke-width="2.5"/>
    <text x="332" y="545" class="num" fill="#2de2ff">03</text>
    <text x="298" y="552" class="label" text-anchor="end">PAN SERVO</text>

    <path class="lead" d="M764 652 L 792 698"/>
    <circle cx="806" cy="716" r="21" fill="#070b16" stroke="#b6f35a" stroke-width="2.5"/>
    <text x="806" y="717" class="num" fill="#b6f35a">04</text>
    <text x="840" y="724" class="label">VISION COMPUTER</text>

    <path class="lead" d="M572 786 L 786 828"/>
    <circle cx="806" cy="834" r="21" fill="#070b16" stroke="#ffc24b" stroke-width="2.5"/>
    <text x="806" y="835" class="num" fill="#ffc24b">05</text>
    <text x="840" y="842" class="label">BATTERY</text>

    <path class="lead" d="M585 694 L 786 772"/>
    <circle cx="806" cy="775" r="21" fill="#070b16" stroke="#8b9bc0" stroke-width="2.5"/>
    <text x="806" y="776" class="num" fill="#8b9bc0">06</text>
    <text x="840" y="783" class="label">TRIPOD MOUNT</text>
  </g>

  <!-- ===== spec box ===== -->
  <rect x="1110" y="180" width="430" height="300" rx="16" fill="#0b1222" stroke="#22304d" stroke-width="2"/>
  <text x="1138" y="226" class="spec-k">TRACKS</text>  <text x="1290" y="226" class="spec-v">any horse,</text>
  <text x="1290" y="256" class="spec-v">the one you tap</text>
  <text x="1138" y="302" class="spec-k">MARKERS</text> <text x="1290" y="302" class="spec-v">none: no tags,</text>
  <text x="1290" y="332" class="spec-v">radios or QR codes</text>
  <text x="1138" y="378" class="spec-k">MOVES</text>   <text x="1290" y="378" class="spec-v">pan + tilt servos</text>
  <text x="1138" y="424" class="spec-k">FRAMES</text>  <text x="1290" y="424" class="spec-v">optical zoom</text>
  <text x="1290" y="454" class="spec-v">in and out</text>

  <!-- ===== front view inset ===== -->
  <rect x="1110" y="540" width="430" height="410" rx="16" fill="#0b1222" stroke="#22304d" stroke-width="2"/>
  <text x="1138" y="584" class="mono" font-size="19" font-weight="600" fill="#8b9bc0" letter-spacing="3">FRONT VIEW</text>
  <g stroke="#3a4a6b" stroke-width="8" stroke-linecap="round">
    <path d="M1325 868 L1250 930"/><path d="M1325 868 L1400 930"/><path d="M1325 868 L1325 932" stroke="#26334f"/>
  </g>
  <rect x="1285" y="856" width="80" height="14" rx="4" fill="#22304d" stroke="#3a4a6b" stroke-width="2"/>
  <rect x="1262" y="796" width="126" height="60" rx="10" fill="#141d33" stroke="#2de2ff" stroke-width="2.5"/>
  <rect x="1254" y="784" width="142" height="13" rx="6" fill="#22304d" stroke="#2de2ff" stroke-width="2"/>
  <path d="M1262 784 V 690 H 1288 V 784 M1362 784 V 690 H 1388 V 784" fill="#1a2540" stroke="#2de2ff" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="1290" y="680" width="70" height="90" rx="10" fill="#11192e" stroke="#8b6cff" stroke-width="2.5"/>
  <circle cx="1325" cy="728" r="30" fill="#1a2442" stroke="#8b6cff" stroke-width="2.5"/>
  <circle cx="1325" cy="728" r="19" fill="#2de2ff" fill-opacity=".5"/>
  <rect x="1388" y="704" width="28" height="46" rx="5" fill="#22304d" stroke="#2de2ff" stroke-width="2"/>
  <circle cx="1275" cy="728" r="6" fill="#2de2ff"/><circle cx="1375" cy="728" r="6" fill="#2de2ff"/>
  
  <text x="1430" y="733" class="mono" font-size="17" fill="#8b9bc0">tilt</text>
  <text x="1430" y="755" class="mono" font-size="17" fill="#8b9bc0">servo</text>
  <text x="1138" y="618" class="mono" font-size="17" fill="#8b9bc0">U-shaped yoke: the camera</text>
  <text x="1138" y="640" class="mono" font-size="17" fill="#8b9bc0">tilts between the arms</text>
  
  

  <text x="60" y="968" class="mono" font-size="18" fill="#56658a" letter-spacing="1">Concept only: parts not chosen yet. Not to scale.</text>
</svg>
