<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040">
  <title>Homelab NAS wiring: SATA data from the M.2 adapter to the drive cage, and Molex power from the switched power supply</title>
  <style>
    @font-face { font-family: "Inter"; src: url("/assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; }
    @font-face { font-family: "JetBrains Mono"; src: url("/assets/fonts/JetBrainsMono-Variable.woff2") format("woff2"); font-weight: 100 800; }
    .t { font-family: "Inter", system-ui, sans-serif; fill: #e7ecf1; }
    .m { font-family: "JetBrains Mono", ui-monospace, monospace; }
    .k { font: 500 17px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.14em; fill: #9fd8ff; }
    .h { font: 500 25px "Inter", system-ui, sans-serif; fill: #e7ecf1; }
    .s { font: 400 19px "Inter", system-ui, sans-serif; fill: #b4bdc7; }
    .n { font: 500 16px "JetBrains Mono", ui-monospace, monospace; fill: #7c8692; letter-spacing: 0.08em; }
    .blk { fill: #0e131a; stroke: #2a3440; stroke-width: 2; }
    .sub { fill: #121922; stroke: #2a3440; stroke-width: 1.5; }
    .port { fill: #0b0f14; stroke: #9fd8ff; stroke-width: 2; }
    .spare { fill: #0b0f14; stroke: #3a4552; stroke-width: 2; stroke-dasharray: 4 3; }
    .sata { fill: none; stroke: #9fd8ff; stroke-width: 4; stroke-linecap: round; }
    .w { fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.3" fill="#151c25"/></pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7c8692"/></marker>
  </defs>

  <rect width="1600" height="1040" fill="#0b0f14"/>
  <rect width="1600" height="1040" fill="url(#dots)"/>

  <!-- title -->
  <text x="60" y="86" class="t" font-size="46" font-weight="300" letter-spacing="-1.5">NAS wiring</text>
  <text x="62" y="124" class="k">DATA AND POWER · SCHEMATIC</text>
  <g transform="translate(1100 70)">
    <path d="M0 10 H44" class="sata"/><text x="58" y="16" class="n">SATA DATA</text>
    <path d="M200 10 H244" class="w" stroke="#f2c94c"/><text x="258" y="16" class="n">12 V</text>
    <path d="M0 44 H44" class="w" stroke="#e0483e"/><text x="58" y="50" class="n">5 V</text>
    <path d="M200 44 H244" class="w" stroke="#6b7684"/><text x="258" y="50" class="n">GROUND</text>
    <path d="M0 78 H44" class="w" stroke="#7ddc8a"/><text x="58" y="84" class="n">PS_ON</text>
  </g>

  <!-- ===== ThinkCentre ===== -->
  <rect x="60" y="170" width="520" height="520" rx="18" class="blk"/>
  <text x="88" y="212" class="k">THINKCENTRE TINY · M920Q</text>

  <rect x="88" y="270" width="464" height="78" rx="10" class="sub"/>
  <text x="108" y="300" class="n">M.2 SLOT 1</text>
  <text x="108" y="331" class="h" font-size="21">512 GB NVMe SSD · system drive</text>

  <rect x="88" y="362" width="464" height="118" rx="10" class="sub" stroke="#e0483e" stroke-opacity=".7"/>
  <text x="108" y="392" class="n">M.2 SLOT 2</text>
  <text x="108" y="423" class="h" font-size="21">RIITOP M.2-to-SATA</text>
  <text x="108" y="455" class="s">PCIe 3.0 ×2 in, 6 SATA out</text>

  <rect x="88" y="494" width="464" height="78" rx="10" class="sub"/>
  <text x="108" y="524" class="n">PCIe RISER</text>
  <text x="108" y="555" class="h" font-size="21">Intel X710 · 10 GbE</text>

  <rect x="88" y="586" width="464" height="78" rx="10" class="sub"/>
  <text x="108" y="616" class="n">USB</text>
  <text x="108" y="647" class="h" font-size="21">Fan speed regulator</text>

  <!-- network and power out of the Tiny -->
  <path d="M552 533 H592" fill="none" stroke="#7c8692" stroke-width="2" marker-end="url(#arr)"/>
  <text x="600" y="539" class="n">NETWORK</text>
  <path d="M552 625 H592" fill="none" stroke="#7c8692" stroke-width="2" marker-end="url(#arr)"/>
  <text x="600" y="631" class="n">BLOWER OVER THE X710</text>
  <path d="M320 690 V730" fill="none" stroke="#7c8692" stroke-width="2" marker-end="url(#arr)" transform="rotate(180 320 710)"/>
  <text x="338" y="732" class="n">OWN POWER ADAPTER</text>

  <!-- SATA ports on the adapter -->
  <g>
    <rect x="566" y="374" width="28" height="15" rx="3" class="port"/>
    <rect x="566" y="391" width="28" height="15" rx="3" class="port"/>
    <rect x="566" y="408" width="28" height="15" rx="3" class="port"/>
    <rect x="566" y="425" width="28" height="15" rx="3" class="port"/>
    <rect x="566" y="442" width="28" height="15" rx="3" class="spare"/>
    <rect x="566" y="459" width="28" height="15" rx="3" class="spare"/>
  </g>
  <text x="604" y="470" class="n" font-size="14">5–6 SPARE</text>

  <!-- ===== Drive cage ===== -->
  <rect x="1020" y="170" width="520" height="520" rx="18" class="blk"/>
  <text x="1048" y="212" class="k">ROSEWILL RSV-SATA-CAGE-34</text>
  <text x="1048" y="244" class="s">Four hot-swap bays on one backplane</text>
  <g>
    <rect x="1048" y="270" width="464" height="62" rx="10" class="sub"/>
    <rect x="1048" y="342" width="464" height="62" rx="10" class="sub"/>
    <rect x="1048" y="414" width="464" height="62" rx="10" class="sub"/>
    <rect x="1048" y="486" width="464" height="62" rx="10" class="sub"/>
    <text x="1104" y="309" class="h" font-size="20">Bay 1 · 3.5" hard drive</text>
    <text x="1104" y="381" class="h" font-size="20">Bay 2 · 3.5" hard drive</text>
    <text x="1104" y="453" class="h" font-size="20">Bay 3 · 3.5" hard drive</text>
    <text x="1104" y="525" class="h" font-size="20">Bay 4 · 3.5" hard drive</text>
    <circle cx="1484" cy="301" r="6" fill="#6aa8ff" filter="url(#glow)"/>
    <circle cx="1484" cy="373" r="6" fill="#6aa8ff" filter="url(#glow)"/>
    <circle cx="1484" cy="445" r="6" fill="#6aa8ff" filter="url(#glow)"/>
    <circle cx="1484" cy="517" r="6" fill="#6aa8ff" filter="url(#glow)"/>
    <rect x="1006" y="293" width="28" height="16" rx="3" class="port"/>
    <rect x="1006" y="365" width="28" height="16" rx="3" class="port"/>
    <rect x="1006" y="437" width="28" height="16" rx="3" class="port"/>
    <rect x="1006" y="509" width="28" height="16" rx="3" class="port"/>
  </g>
  <rect x="1048" y="566" width="464" height="98" rx="10" class="sub"/>
  <text x="1068" y="596" class="n">BACKPLANE</text>
  <text x="1068" y="626" class="s">4 × SATA in, 2 × Molex in</text>
  <text x="1068" y="652" class="s">Also powers the 120 mm fan</text>

  <!-- Molex inputs on the backplane, with the plugs mated below them -->
  <rect x="1150" y="690" width="48" height="10" fill="#3a4552"/>
  <rect x="1362" y="690" width="48" height="10" fill="#3a4552"/>

  <!-- ===== SATA data cables ===== -->
  <g filter="url(#glow)">
    <path d="M594 381 C 760 381, 840 301, 1006 301" class="sata"/>
    <path d="M594 398 C 770 398, 830 373, 1006 373" class="sata"/>
    <path d="M594 415 C 780 415, 820 445, 1006 445" class="sata"/>
    <path d="M594 432 C 790 432, 810 517, 1006 517" class="sata"/>
  </g>
  <text x="800" y="262" class="n" text-anchor="middle" fill="#9fd8ff">4 × SATA · 6 Gb/s</text>

  <!-- ===== Power supply ===== -->
  <rect x="580" y="790" width="440" height="190" rx="18" class="blk"/>
  <text x="608" y="832" class="k">ESGAMING 300 W</text>
  <!-- AC in -->
  <path d="M560 935 H600" fill="none" stroke="#7c8692" stroke-width="2" marker-end="url(#arr)" transform="rotate(180 580 935)"/>
  <text x="608" y="941" class="n">AC IN</text>
  <!-- modular sockets -->
  <rect x="880" y="812" width="118" height="44" rx="6" class="sub"/>
  <text x="939" y="840" class="m" font-size="15" font-weight="600" fill="#e7ecf1" text-anchor="middle">SATA</text>
  <rect x="880" y="912" width="118" height="44" rx="6" class="sub"/>
  <text x="939" y="940" class="m" font-size="15" font-weight="600" fill="#e7ecf1" text-anchor="middle">P24</text>

  <!-- Molex wires: one cable through plug A and on to plug B -->
  <g class="w">
    <path d="M998 822 H1060 Q1070 822 1070 812 V722 Q1070 712 1080 712 H1420" stroke="#f2c94c"/>
    <path d="M998 830 H1068 Q1078 830 1078 820 V730 Q1078 720 1088 720 H1420" stroke="#6b7684"/>
    <path d="M998 838 H1076 Q1086 838 1086 828 V738 Q1086 728 1096 728 H1420" stroke="#6b7684"/>
    <path d="M998 846 H1084 Q1094 846 1094 836 V746 Q1094 736 1104 736 H1420" stroke="#e0483e"/>
  </g>
  <rect x="1128" y="700" width="92" height="48" rx="6" fill="#e8e3d6" stroke="#9a958a" stroke-width="2"/>
  <text x="1174" y="730" class="m" font-size="15" font-weight="600" fill="#2a2620" text-anchor="middle">MOLEX A</text>
  <rect x="1340" y="700" width="92" height="48" rx="6" fill="#e8e3d6" stroke="#9a958a" stroke-width="2"/>
  <text x="1386" y="730" class="m" font-size="15" font-weight="600" fill="#2a2620" text-anchor="middle">MOLEX B</text>
  <text x="1280" y="784" class="n" font-size="14" text-anchor="middle">ONE MOLEX CABLE, TWO PLUGS</text>

  <!-- switch on the 24-pin socket -->
  <g class="w">
    <path d="M998 926 H1120 V900" stroke="#7ddc8a"/>
    <path d="M998 942 H1250 V900" stroke="#6b7684"/>
  </g>
  <circle cx="1120" cy="894" r="6" fill="#0b0f14" stroke="#e7ecf1" stroke-width="2.5"/>
  <circle cx="1250" cy="894" r="6" fill="#0b0f14" stroke="#e7ecf1" stroke-width="2.5"/>
  <path d="M1124 889 L1238 858" stroke="#e7ecf1" stroke-width="3" stroke-linecap="round"/>
  <text x="1185" y="842" class="n" text-anchor="middle" fill="#e7ecf1">SWITCH</text>
  <text x="1290" y="902" class="s" font-size="18">Closed = on: PS_ON to ground.</text>
  <text x="1290" y="928" class="s" font-size="18">Just two wires on P24.</text>

  <text x="60" y="1010" class="n" font-size="15">Schematic, not to scale. The ThinkCentre and the drive cage share no power: only data crosses between them.</text>
</svg>
