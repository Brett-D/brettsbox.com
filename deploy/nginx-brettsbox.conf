# Served behind the Cloudflare Tunnel (cloudflared connects to localhost:80).

# Golf sign-in and sign-up attempts, per visitor. Cloudflare passes the visitor's address in
# CF-Connecting-IP; everything else arrives from cloudflared on loopback.
map $http_cf_connecting_ip $golf_client {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $golf_client zone=golf_auth:10m rate=10r/m;

server {
    # Only cloudflared (same container) needs the site, so listen on loopback only:
    # nothing else on the network can reach nginx directly.
    listen 127.0.0.1:80 default_server;
    listen [::1]:80 default_server;
    server_name brettsbox.com www.brettsbox.com _;
    server_tokens off;

    root /srv/brettsbox/public;
    index index.html;

    # Golf tee sheet API: relayed to the Python app, which listens on loopback only
    # (deploy/golf-api.service). Nothing else under /api/ exists.
    location ^~ /api/golf/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $golf_client;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
        limit_req_status 429;

        location ^~ /api/golf/auth/ {
            limit_req zone=golf_auth burst=5 nodelay;
            proxy_pass http://127.0.0.1:8787;
        }
    }

    # Golf PWA: revalidated on every load (cheap 304s) so installed apps pick up releases at once.
    location ^~ /golf/ {
        try_files $uri $uri/ /golf/index.html;
        types {
            text/html html;
            text/css css;
            text/javascript js;
            application/manifest+json webmanifest;
            image/png png;
            image/svg+xml svg;
        }
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # /blog/some-post serves /blog/some-post.html or /blog/some-post/index.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Never serve the git metadata.
    location ~ /\. { deny all; }

    location ~* \.(css|js|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2|mp4|webm)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json application/manifest+json text/plain;

    error_page 404 /404.html;
}
