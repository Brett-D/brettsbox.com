# Served behind the Cloudflare Tunnel (cloudflared connects to localhost:80).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name brettsbox.com www.brettsbox.com _;
    server_tokens off;

    root /srv/brettsbox/public;
    index index.html;

    # /blog/some-post serves /blog/some-post.html or /blog/some-post/index.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Never serve the git metadata.
    location ~ /\. { deny all; }

    location ~* \.(css|js|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2|mp4|webm)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    error_page 404 /404.html;
}