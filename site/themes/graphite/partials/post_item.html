<li class="post-row" data-reveal>
  <a class="post-row__link" href="{{href}}">
    <span class="post-row__part">#{{part}}</span>
    <span class="post-row__body">
      <span class="post-row__meta"><time datetime="{{date_iso}}">{{date_human}}</time> · {{minutes}} min</span>
      <span class="post-row__title">{{title}}</span>
      <span class="post-row__summary">{{summary}}</span>
    </span>
    <span class="post-row__arrow" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 8h11M9 4l4 4-4 4"/></svg></span>
  </a>
</li>
