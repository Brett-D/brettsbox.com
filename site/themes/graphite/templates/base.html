<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{og}}
<meta name="theme-color" content="#06080b">
<meta name="color-scheme" content="dark">
<link rel="icon" href="{{base}}/favicon.svg" type="image/svg+xml">
<link rel="alternate" type="application/atom+xml" title="Brett's Box build log" href="{{base}}/feed.xml">
<link rel="preload" href="/assets/fonts/Inter-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{base}}/style.css?v={{css_version}}">
<script>document.documentElement.className = 'js';</script>
<script src="{{base}}/app.js?v={{js_version}}" defer></script>
</head>
<body class="{{body_class}}">
<a class="skip-link" href="#main">Skip to content</a>
<div class="progress" aria-hidden="true"></div>
<header class="site-header">
  <a class="round" href="{{base}}/blog/" aria-label="Build log"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path class="ecg-base" d="M1 13h5l2.5-6 4 12 3-9 2 3H23"/><path class="ecg" d="M1 13h5l2.5-6 4 12 3-9 2 3H23" pathLength="100"/></svg></a>
  <div class="capsule">
    <a class="brand" href="{{base}}/" aria-label="Brett's Box, home"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="bbf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fd8ff"/><stop offset="1" stop-color="#4a8dff"/></linearGradient><linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#9fd8ff"/></linearGradient><filter id="bbb" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.4"/></filter><filter id="bbl" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="2.6"/></filter><rect id="bbr" x="11" y="11" width="42" height="42" rx="12" fill="none" stroke-width="3.5"/><path id="bbp" d="M22.6 44V21H31.81Q34.29 21 36.02 21.74Q37.75 22.49 38.65 23.81Q39.55 25.14 39.55 26.91Q39.55 28.23 39.04 29.26Q38.54 30.29 37.62 30.97Q36.69 31.65 35.43 31.97V32.01Q36.83 32.13 37.96 32.82Q39.08 33.51 39.74 34.69Q40.4 35.88 40.4 37.51Q40.4 39.43 39.47 40.9Q38.55 42.36 36.75 43.18Q34.95 44 32.33 44ZM27.25 40.26H31.68Q33.51 40.26 34.53 39.48Q35.55 38.69 35.55 37.26Q35.55 36.29 35.1 35.59Q34.65 34.9 33.8 34.52Q32.95 34.13 31.75 34.13H27.25ZM27.25 30.56H31.46Q32.51 30.56 33.26 30.21Q34.01 29.85 34.41 29.2Q34.82 28.54 34.82 27.65Q34.82 26.31 33.92 25.53Q33.03 24.74 31.46 24.74H27.25Z"/></defs><rect width="64" height="64" rx="18" fill="#0b0f14"/><rect x=".75" y=".75" width="62.5" height="62.5" rx="17.25" fill="none" stroke="#9fd8ff" stroke-opacity=".22" stroke-width="1.5"/><g filter="url(#bbb)" opacity=".7"><use href="#bbr" stroke="#4a8dff"/><use href="#bbp" fill="#9fd8ff"/></g><use href="#bbr" stroke="url(#bbf)"/><use href="#bbp" fill="url(#bbg)"/><circle cx="49.5" cy="14.5" r="7.4" fill="#0b0f14"/><g class="brand__led"><circle cx="49.5" cy="14.5" r="6" fill="#4a8dff" filter="url(#bbl)"/><circle cx="49.5" cy="14.5" r="4.4" fill="#bfe6ff"/><circle cx="48.2" cy="13.2" r="1.3" fill="#fff" opacity=".8"/></g></svg></a>
    <nav class="site-nav" id="site-nav" aria-label="Main">
      <ul>
{{nav}}
      </ul>
    </nav>
  </div>
  <a class="chip chip--feed" href="{{base}}/feed.xml"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1.4" fill="currentColor"/></svg>Feed</a>
  <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav"><span class="nav-toggle__bars" aria-hidden="true"></span><span class="nav-toggle__label">Menu</span></button>
</header>
<main id="main">
{{content}}
</main>
<footer class="site-footer">
  <div class="wrap">
    <p class="footer__mark" aria-hidden="true">Brett's Box</p>
    <div class="footer__row">
      <p class="footer__about">A maker's lab notebook: robots, homelab and 3D printing. Built with GitHub Copilot, no trackers.</p>
      <ul class="footer__links">
        <li><a href="{{github}}">GitHub ↗</a></li>
        <li><a href="{{base}}/feed.xml">Atom feed</a></li>
        <li><a href="#main">Back to top ↑</a></li>
      </ul>
    </div>
    <p class="footer__fine"><span>© {{year}} Brett</span><span>Built with GitHub Copilot</span><span>No trackers</span></p>
  </div>
</footer>
</body>
</html>
