<article class="post">
  <header class="hero hero--post" data-scenes="{{scene}}">
    <canvas class="hero__cloud" aria-hidden="true"></canvas>
    <canvas class="hero__hud" aria-hidden="true"></canvas>
    <div class="hero__shade" aria-hidden="true"></div>
    <div class="frame" aria-hidden="true">
      <svg><rect x="0" y="0" width="100%" height="100%" rx="18" pathLength="1"/></svg>
      <i class="mark mark--tl"></i><i class="mark mark--tr"></i><i class="mark mark--bl"></i><i class="mark mark--br"></i><i class="ticks"></i><i class="ticks ticks--b"></i>
    </div>
    <div class="readout readout--l" aria-hidden="true"></div>
    <div class="readout readout--r" aria-hidden="true"></div>
    <div class="hero__copy">
      <p class="kicker kicker--cursor">// <a href="{{base}}/blog/">Build log</a> · Entry {{part}} / {{total}}</p>
      <h1 class="hero__title"><span class="ln"><span>{{title}}</span></span></h1>
      <p class="hero__lede">{{summary}}</p>
      <ul class="post-meta">
        <li><time datetime="{{date_iso}}">{{date_human}}</time></li>
        <li>{{minutes}} min read</li>
        <li><ul class="tags">{{tags}}</ul></li>
      </ul>
    </div>
  </header>
  <div class="prose">
{{body}}
  </div>
  <nav class="wrap post-nav" aria-label="More build-log entries">
    {{prev}}
    {{next}}
  </nav>
</article>
