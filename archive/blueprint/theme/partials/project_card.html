<a class="project-card" href="{{href}}" data-reveal>
  <span class="project-card__head"><span class="project-card__code">{{code}}</span><span class="pill pill--{{status_kind}}">{{status}}</span></span>
  <span class="project-card__title">{{title}}</span>
  <span class="project-card__summary">{{summary}}</span>
  <ul class="tags">{{tags}}</ul>
  <span class="project-card__go" aria-hidden="true">cd →</span>
</a>
