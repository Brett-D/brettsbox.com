<li class="post-card" data-reveal>
  <a class="post-card__link" href="{{href}}">
    <span class="post-card__part">#{{part}}</span>
    <span class="post-card__body">
      <span class="post-card__meta"><time datetime="{{date_iso}}">{{date_human}}</time> · {{minutes}} min</span>
      <span class="post-card__title">{{title}}</span>
      <span class="post-card__summary">{{summary}}</span>
    </span>
    <span class="post-card__arrow" aria-hidden="true">→</span>
  </a>
</li>
