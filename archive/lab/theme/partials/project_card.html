<a class="project-card project-card--{{accent}}" href="{{href}}" data-reveal>
  <span class="project-card__top"><span class="project-card__code">{{code}}</span><span class="pill pill--{{status_kind}}">{{status}}</span></span>
  <span class="project-card__title">{{title}}</span>
  <span class="project-card__summary">{{summary}}</span>
  <ul class="tags">{{tags}}</ul>
  <span class="project-card__go" aria-hidden="true">→</span>
</a>
